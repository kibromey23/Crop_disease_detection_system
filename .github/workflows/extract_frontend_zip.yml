name: Extract frontend zip and update frontend folder

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install unzip and rsync
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip rsync

      - name: Verify frontend.zip exists
        run: |
          echo "Listing frontend/"
          ls -la frontend || true
          if [ ! -f frontend/frontend.zip ]; then
            echo "Error: frontend/frontend.zip not found"
            exit 1
          fi

      - name: Extract frontend.zip to temp dir
        run: |
          set -euo pipefail
          TMPDIR=$(mktemp -d)
          echo "Extracting into $TMPDIR"
          unzip -q frontend/frontend.zip -d "$TMPDIR"
          # Determine extracted folder. If zip contains a top-level 'frontend' directory prefer that.
          if [ -d "$TMPDIR/frontend" ]; then
            EXTRACTED="$TMPDIR/frontend"
          else
            # pick first directory under TMPDIR
            EXTRACTED=$(find "$TMPDIR" -maxdepth 1 -mindepth 1 -type d | head -n1)
            if [ -z "$EXTRACTED" ]; then
              echo "No directory found in zip; assuming files at root of zip"
              EXTRACTED="$TMPDIR"
            fi
          fi
          echo "Using extracted path: $EXTRACTED"
          ls -la "$EXTRACTED"
          # Prepare the replacement folder
          rm -rf frontend_new || true
          mv "$EXTRACTED" frontend_new
          ls -la frontend_new

      - name: Replace frontend directory (overwrite)
        run: |
          set -euo pipefail
          # Remove existing frontend folder entirely (this will also remove frontend/frontend.zip)
          rm -rf frontend || true
          # Move extracted content into place
          mv frontend_new frontend
          # Ensure correct permissions
          git add -A frontend

      - name: Commit and push changes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Update frontend application from latest version"
          # Push back to the branch we checked out (should be default branch)
          git push origin HEAD
